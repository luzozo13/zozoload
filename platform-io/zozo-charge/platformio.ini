; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ttgo-t7-v14-mini32]
platform = espressif32
board = ttgo-t7-v14-mini32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -DCORE_DEBUG_LEVEL=3 -DMQTT_MAX_PACKET_SIZE=512
upload_protocol = espota
upload_port = 192.168.1.10
; PZEM-004T-v30 must be >= 1.2.1: 1.1.x returns the same cached reading forever
; once millis() wraps (49.7 days of uptime).
lib_deps =
  knolleary/PubSubClient
  https://github.com/mandulaj/PZEM-004T-v30.git#v1.2.1  ; 1.2.1 is not on the PlatformIO registry (latest there: 1.1.2)